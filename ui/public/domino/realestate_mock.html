<script>(() => { // ?theme=white | offwhite (dark is the default)

<style>
:root{
  --plane:#0A0F16; --panel:#0E141D; --card:#131B26; --card-2:#182230; --hair:#1F2A38; --hair-2:#2B3849;
  --ink:#EFE8D8; --ink-2:#A3AEBB; --ink-3:#6B7785;
  --accent:#F0A43A; --up:#4CC38A; --down:#EF6461; --hold:#E9C46A; --driver:#5FA8D3;
  --tile:#ECE4D1; --tile-ink:#141A22; --tile-edge:#BFB399;
  --display:"DIN Condensed","DIN Alternate","Bahnschrift SemiBold Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--plane);color:var(--ink);font:14px/1.4 var(--sans);overflow:hidden}
.app{height:100vh;display:grid;grid-template-rows:60px 1fr}
.top{display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--hair)}
.mark{width:22px;height:34px;border-radius:5px;background:var(--tile);display:grid;grid-template-rows:1fr 2px 1fr;padding:4px 0}
.mark i{display:block;width:5px;height:5px;border-radius:50%;background:var(--tile-ink);margin:auto} .mark b{background:var(--tile-edge);margin:0 4px}
.wordmark{font:700 27px/1 var(--display);letter-spacing:.14em}
.tagline{color:var(--ink-2);font-size:12.5px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-left:18px}
.tab{padding:7px 12px;border-radius:8px;border:1px solid var(--hair-2);color:var(--ink-2);text-decoration:none;font:600 12.5px var(--sans);white-space:nowrap}
.tab b{font-family:var(--mono);margin-right:6px;color:var(--ink-3)}
.tab.on{background:var(--accent);border-color:var(--accent);color:#1A1206} .tab.on b{color:#1A1206}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--hair-2);color:var(--ink-2);font-size:12px;white-space:nowrap}
.chip b{color:var(--ink);font-family:var(--mono);font-size:11.5px}
main{min-height:0;padding:10px 14px;display:grid;gap:10px}
.panel{position:relative;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:10px 12px;min-width:0;min-height:0;overflow:hidden}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.eyebrow{font:700 15px/1 var(--display);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2)}
.ph .hint{margin-left:auto;color:var(--ink-3);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* KPI tiles */
.kpis{display:grid;gap:8px}
.kpi{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:8px 12px;min-width:0}
.kpi .l{color:var(--ink-2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font:700 34px/1.05 var(--display)}
.kpi .s{color:var(--ink-2);font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s b{color:var(--ink)}
/* ranking list */
.rk{width:100%;border-collapse:collapse}
.rk td{padding:4px 6px;border-bottom:1px solid var(--hair);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.rk td.n{color:var(--ink-3);text-align:left;width:18px} .rk td.m{text-align:left;font-weight:600}
.rk td.m small{display:block;color:var(--ink-3);font-weight:400;font-size:10.5px;line-height:1.1}
.rk th{font:600 10px/1.2 var(--sans);color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;text-align:right;padding:3px 6px;border-bottom:1px solid var(--hair-2)}
.rk th:nth-child(1),.rk th:nth-child(2){text-align:left}
.bar{display:inline-grid;grid-template-columns:54px 44px;gap:5px;align-items:center}
.bar i{height:7px;border-radius:4px;background:var(--hair-2);position:relative;overflow:hidden;display:block}
.bar i u{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:4px} .bar i u.neg{background:var(--down)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font:700 10.5px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.05em}
.pill.buy,.pill.accumulate{background:rgba(76,195,138,.16);color:var(--up)} .pill.hold{background:rgba(233,196,106,.16);color:var(--hold)} .pill.avoid{background:rgba(239,100,97,.16);color:var(--down)}
tr.sel td{background:var(--card-2)} tr[data-id]{cursor:pointer}
/* chain cards: level and evenly spaced */
.cgroups{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:end;height:100%}
.cgroup{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.cgroup .gt{font:700 12.5px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.crow{display:flex;align-items:center;justify-content:space-evenly;width:100%}
.card{width:132px;height:88px;background:var(--tile);color:var(--tile-ink);border-radius:9px;display:grid;grid-template-rows:auto 2px 1fr;box-shadow:inset 0 -3px 0 var(--tile-edge),0 6px 14px rgba(0,0,0,.45)}
.card .t{padding:7px 9px 5px;font:700 11.5px/1.15 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mid{background:var(--tile-edge);margin:0 10px}
.card .b{display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .b strong{font:700 24px/1 var(--display)} .card .b small{font-size:10.5px;color:#4A5160;margin-top:1px}
.card.life{box-shadow:inset 0 -3px 0 var(--tile-edge),0 0 0 2px var(--accent),0 6px 14px rgba(0,0,0,.45)}
.arrow{color:var(--ink-3);font:600 20px/1 var(--sans)}
.ev{color:var(--ink-3);font-size:11px;text-align:center} .ev b{color:var(--up);font-weight:600}
.sep{width:1px;align-self:stretch;background:var(--hair-2)}
/* globes and graph */
.viz{position:absolute;inset:34px 0 0 0}
.viz.full{inset:0}
.gtitle{position:absolute;left:12px;top:10px;z-index:2;pointer-events:none}
.gtitle .s{color:var(--ink-3);font-size:11.5px;margin-top:4px;line-height:1.5;background:rgba(10,15,22,.55);border-radius:6px;padding:2px 4px 2px 0}
.legend{position:absolute;right:10px;bottom:8px;z-index:2;display:flex;gap:12px;align-items:center;background:rgba(10,15,22,.72);border:1px solid var(--hair);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--ink-2)}
.legend i{display:inline-block;width:22px;height:0;border-top:2px solid #E4ECF6;vertical-align:middle;margin-right:5px}
.legend i.p{border-top:2px dashed #9AA7B8} .legend i.n{border-top:2px dashed #EF6461} .legend i.a{border-top:2px dotted #7D8999}
.legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.glab{font:600 11.5px/1.15 var(--sans);color:var(--ink);background:rgba(10,15,22,.78);border:1px solid var(--hair-2);border-radius:6px;padding:3px 6px;white-space:nowrap;pointer-events:none;transform:translate(10px,-50%)}
.glab small{display:block;color:var(--ink-2);font-weight:500;font-size:10.5px}
.glab.drv{border-color:rgba(95,168,211,.45);color:#CFE3F1;font-size:10.5px}
.glab.dim{opacity:.25}
.glab.walk{pointer-events:auto;cursor:pointer;border:1.5px solid var(--accent);box-shadow:0 0 0 3px rgba(224,138,20,.18)}
.glab.walk:hover{background:var(--accent);color:#1A1206} .glab.walk:hover small,.glab.walk:hover .wk{color:#1A1206}
.wk{font:700 9.5px/1 var(--sans);font-style:normal;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-left:6px;white-space:nowrap}
.glab .wk{display:block;margin:3px 0 1px}
.regions{position:absolute;right:10px;top:8px;z-index:3;display:flex;gap:6px}
.regions button{background:var(--card);color:var(--ink-2);border:1px solid var(--hair-2);border-radius:7px;padding:5px 9px;font:600 11.5px var(--sans);cursor:pointer}
.regions button.on{color:#1A1206;background:var(--accent);border-color:var(--accent)}
.nlab{position:absolute;left:0;top:0;transform:translate(-50%,8px);text-align:center;pointer-events:none;font:600 11px/1.15 var(--sans);color:var(--ink);white-space:nowrap;text-shadow:0 1px 2px #000}
.nlab small{display:block;color:var(--ink-2);font-weight:500;font-size:10.5px}
.nlab.dim{opacity:.22}
.glabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* market cards strip (V2) */
.mcards{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;height:100%}
.mc{background:var(--card);border:1px solid var(--hair);border-radius:10px;padding:8px 9px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.mc.sel{border-color:var(--accent)}
.mc .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .big{font:700 26px/1 var(--display)} .mc .sub{color:var(--ink-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* flow (V3) */
#flow{width:100%;height:100%;display:block}
#flow .box{fill:var(--card);stroke:var(--hair-2);stroke-width:1}
#flow .box.driver{stroke:rgba(95,168,211,.55)} #flow .box.channel{stroke:rgba(240,164,58,.65)} #flow .box.outcome{stroke:var(--accent);stroke-width:1.6}
#flow text{fill:var(--ink);font:600 12.5px var(--sans)} #flow text.v{fill:var(--ink-2);font-weight:500;font-size:11.5px}
#flow text.h{fill:var(--ink-3);font:700 13px var(--display);letter-spacing:.12em}
#flow path.l{fill:none}
#flow path.measured{stroke:#E4ECF6;stroke-width:2.4}
#flow path.pulse{fill:none;stroke:#F0A43A;stroke-width:2.4;stroke-dasharray:3 22;animation:flow 1.1s linear infinite}
#flow path.prior{stroke:#9AA7B8;stroke-width:1.2;stroke-dasharray:5 4;opacity:.75}
#flow path.noskill{stroke:#EF6461;stroke-width:1.2;stroke-dasharray:4 4;opacity:.7}
#flow path.anecdotal{stroke:#7D8999;stroke-width:1.2;stroke-dasharray:1.5 4;opacity:.85}
#flow g.dim{opacity:.18}
@keyframes flow{to{stroke-dashoffset:-25}}
#cg{width:100%;height:100%;display:block}
#cg .measured{stroke:#E4ECF6;stroke-width:2.2} #cg .pulse{stroke:#F0A43A;stroke-width:2.2;stroke-dasharray:3 22;animation:flow 1.1s linear infinite}
#cg .prior{stroke:#9AA7B8;stroke-width:1.1;stroke-dasharray:5 4;opacity:.7} #cg .noskill{stroke:#EF6461;stroke-width:1.1;stroke-dasharray:4 4;opacity:.75}
#cg .anecdotal{stroke:#7D8999;stroke-width:1.1;stroke-dasharray:1.5 4;opacity:.85}
#cg text{fill:var(--ink);font:600 12px var(--sans);text-anchor:middle;paint-order:stroke;stroke:#0E141D;stroke-width:3px} #cg text.v{fill:var(--ink-2);font-weight:500;font-size:11px}
#cg g.dim{opacity:.15}
body.tight .rk td{padding:3px 6px} body.tight .rk th{padding:2px 6px}
.pick{color:var(--ink-2);font-size:12px;line-height:1.35}
.pick b{color:var(--ink)}
/* white version: ?theme=white */
:root[data-theme="light"]{
  --plane:#F3F5F8; --panel:#FFFFFF; --card:#F7F9FB; --card-2:#EDF1F6; --hair:#E4E8EE; --hair-2:#D3D9E2;

:root[data-theme="light"] .legend i{border-top-color:#243245} :root[data-theme="light"] .legend i.p{border-top-color:#6E7C8E}
:root[data-theme="light"] .legend i.n{border-top-color:#D64545} :root[data-theme="light"] .legend i.a{border-top-color:#8A94A3}
:root[data-theme="light"] .glab{background:rgba(255,255,255,.95);border-color:var(--hair-2);color:var(--ink);box-shadow:0 1px 3px rgba(20,26,34,.14)}
:root[data-theme="light"] .glab small{color:var(--ink-2)}

:root[data-theme="light"] #flow .box.driver{stroke:rgba(47,120,168,.55)}
:root[data-theme="light"] #flow path.measured,:root[data-theme="light"] #cg .measured{stroke:#243245}
:root[data-theme="light"] #flow path.prior,:root[data-theme="light"] #cg .prior{stroke:#6E7C8E;opacity:.8}

:root[data-theme="light"] #flow path.anecdotal,:root[data-theme="light"] #cg .anecdotal{stroke:#8A94A3}
:root[data-theme="light"] #flow path.pulse,:root[data-theme="light"] #cg .pulse{stroke:#E08A14}
:root[data-theme="light"] #cg text{stroke:#FFFFFF}
/* off-white version: ?theme=offwhite (warm paper tones on top of the white version) */
:root[data-theme="light"][data-tone="offwhite"]{
  --plane:#F1EDE4; --panel:#FBF9F4; --card:#F5F1E8; --card-2:#EDE7DA; --hair:#E4DDCF; --hair-2:#D6CDBB;
  --ink:#1A1916; --ink-2:#55514A; --ink-3:#8B857A; --tile:#FFFDF8; --tile-edge:#D6CDBB;
}
:root[data-tone="offwhite"] .legend,:root[data-tone="offwhite"] .glab{background:rgba(251,249,244,.96)}

.thm a{color:var(--ink-3);text-decoration:none} .thm a.on{color:var(--ink);font-weight:700} .thm a:hover{color:var(--ink)}
</style>

// errors surface on the page (headless screenshots show them); ?errors=0 hides the overlay
(() => { const show = m => { if (new URLSearchParams(location.search).get('errors') === '0') return; let d = document.getElementById('errbox');
  if (!d) { d = document.createElement('div'); d.id = 'errbox'; d.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99;max-width:60vw;background:#2a0f12;color:#ffb4b0;font:12px/1.35 ui-monospace,monospace;padding:6px 8px;border:1px solid #7a2a2a;border-radius:6px;white-space:pre-wrap'; document.body.appendChild(d); }
  d.textContent += m + '\n'; };
  window.addEventListener('error', e => show('error: ' + e.message + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno));
  window.addEventListener('unhandledrejection', e => show('rejection: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
  const ce = console.error.bind(console); console.error = (...a) => { show('console.error: ' + a.map(String).join(' ').slice(0, 300)); ce(...a); }; })();

<script>
(() => { // everything stays out of window (index.html does the same): globals named globe/graph/select can collide with library code
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const pct = (v, d = 1, sign = true) => (isNum(v) ? (sign && v > 0 ? '+' : '') + v.toFixed(d) + '%' : '—');
const V = Math.max(1, Math.min(3, parseInt(new URLSearchParams(location.search).get('v'), 10) || 1));
const LIGHT = document.documentElement.dataset.theme === 'light', OFF = document.documentElement.dataset.tone === 'offwhite';
const THEME = OFF ? 'offwhite' : LIGHT ? 'white' : '', TQ = THEME ? '&theme=' + THEME : ''; // kept when switching mocks
const VERDICT = LIGHT ? { buy: '#1E9E64', accumulate: '#1E9E64', hold: '#B8890F', avoid: '#D64545' } : { buy: '#4CC38A', accumulate: '#4CC38A', hold: '#E9C46A', avoid: '#EF6461' };
const GROUPCOL = LIGHT ? { driver: '#2F78A8', channel: '#E08A14', outcome: '#8C6D2C' } : { driver: '#5FA8D3', channel: '#F0A43A', outcome: '#ECE4D1' };

const LINK = LIGHT ? { measured: '#243245', prior: 'rgba(110,124,142,0.75)', noskill: 'rgba(214,69,69,0.85)', anecdotal: 'rgba(120,132,148,0.7)' }
  : { measured: '#E4ECF6', prior: 'rgba(154,167,184,0.6)', noskill: 'rgba(239,100,97,0.7)', anecdotal: 'rgba(125,137,153,0.55)' };
const PAL = OFF ? { globe: '#DCE4EB', emissive: '#86939F', atmosphere: '#B1C1CF', land: 'rgba(62,64,70,0.6)', dimArc: 'rgba(120,120,115,0.15)', nodeStroke: '#FBF9F4', driverText: '#2F6F98' }
  : LIGHT ? { globe: '#D9E6F3', emissive: '#7C93AE', atmosphere: '#8FB4DE', land: 'rgba(55,80,110,0.62)', dimArc: 'rgba(120,135,155,0.15)', nodeStroke: '#FFFFFF', driverText: '#2F78A8' }
  : { globe: '#0F2034', emissive: '#060E19', atmosphere: '#4F7CAD', land: 'rgba(150,172,200,0.5)', dimArc: 'rgba(120,135,155,0.08)', nodeStroke: '#0A0F16', driverText: '#9CC7E3' };
const REGION = { us: { lat: 33, lng: -93, altitude: 1.35 }, gulf: { lat: 34, lng: 64, altitude: 1.45 }, all: { lat: 34, lng: -12, altitude: 2.0 } };

const MOCKS = [
  { v: 1, name: 'Map-first', desc: 'The globe carries the causal links (US ⇄ Gulf & Kazakhstan); numbers and ranking in the right rail; measured chains below' },

let D = null, SEL = null; const LAND = []; // country rings for the globe paths layer
const listeners = [];

const WALK = new Set((new URLSearchParams(location.search).get('walk') || '').split(',').filter(Boolean));

const NOREG = new URLSearchParams(location.search).get('regions') === '0';

}
function ranking(el, opts = {}) {
  const rows = D.markets || [], mx = Math.max(1, ...rows.map(r => Math.abs(r.model_12m || 0)));
  el.innerHTML = `<table class="rk"><thead><tr><th>#</th><th>Market</th>${opts.yield ? '<th>Gross</th>' : ''}<th>Model 12 m</th><th>Argon</th><th>Verdict</th></tr></thead><tbody>${rows.map((r, i) => {
    const a = r.argon || {}, w = Math.min(100, 100 * Math.abs(r.model_12m || 0) / mx);
    return `<tr data-id="${esc(r.key)}" title="${esc(a.why || '')}"><td class="n">${i + 1}</td><td class="m">${esc(r.market)}${WALK.has(r.key) ? ' <em class="wk">3D office ↗</em>' : ''}${opts.note ? `<small>${esc(r.note || '')}</small>` : ''}</td>${opts.yield ? `<td>${pct(r.gross, 1, false)}</td>` : ''}
      <td><span class="bar"><i><u class="${(r.model_12m || 0) < 0 ? 'neg' : ''}" style="width:${w.toFixed(1)}%"></u></i><b>${pct(r.model_12m)}</b></span></td><td>${pct(a.exp)}</td>
      <td><span class="pill ${esc(a.verdict || '')}">${esc(a.verdict || '—')}</span></td></tr>`; }).join('')}</tbody></table>`;
  el.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => select(tr.dataset.id)));
  listeners.push(id => el.querySelectorAll('tr[data-id]').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === id)));
}
function chains(el) {
  el.innerHTML = `<div class="cgroups">${(D.chains || []).map((c, gi) => `${gi ? '<div class="sep"></div>' : ''}<div class="cgroup"><div class="gt">${esc(c.title)}</div><div class="crow">${(c.cards || []).map((k, i) => `${i ? '<span class="arrow" aria-hidden="true">→</span>' : ''}<div class="card${k.life ? ' life' : ''}"><div class="t">${esc(k.label)}</div><div class="mid"></div><div class="b"><strong>${esc(k.value)}</strong><small>${esc(k.sub || '')}</small></div></div>`).join('')}</div><div class="ev">${c.evidence_html || ''}</div></div>`).join('')}</div>`;
}
const legendHTML = () => `<span><i></i>measured</span><span><i class="p"></i>mechanism (untested)</span><span><i class="n"></i>tested: no skill</span><span><i class="a"></i>anecdotal</span>
  <span><span class="dot" style="background:${VERDICT.buy}"></span>buy</span><span><span class="dot" style="background:${VERDICT.hold}"></span>hold</span><span><span class="dot" style="background:${VERDICT.avoid}"></span>avoid</span>`;

/* ---------------- globe (Globe.gl, the Domino styling): one per page, switched between regions ---------------- */
const ORDER = ['us10y', 'zori', 'jobs_tx', 'tx_tax', 'uae_credit', 'dxb_supply', 'ad_zones', 'froth', 'kzt', 'kz_credit',
  'us_mortgage', 'momentum', 'cpi_rent', 'dallas', 'austin', 'houston', 'san_antonio', 'miami', 'rent_2027', 'dubai', 'abu_dhabi', 'almaty', 'astana'];
function globe(host, opts) {
  let G;
  try { G = new Globe(host, { animateIn: false, rendererConfig: { antialias: true, alpha: true, powerPreference: 'high-performance' } }); }
  catch (e) { host.innerHTML = '<p style="color:#6B7785;padding:20px">No WebGL in this browser.</p>'; return { region() {}, highlight() {} }; }
  const views = { ...REGION, ...(opts.views || {}) };
  const byId = new Map(D.graph.nodes.map(n => [n.id, n]));
  const nodes = D.graph.nodes.filter(n => isNum(n.lat) && isNum(n.lon));
  const ids = new Set(nodes.map(n => n.id));
  const mx = Math.max(1, ...nodes.filter(n => n.group === 'market').map(n => Math.abs(n.model || 0)));
  G.backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor(PAL.atmosphere).atmosphereAltitude(0.13).showGraticules(true)
    .pathPoints('pts').pathPointLat(p => p[1]).pathPointLng(p => p[0]).pathPointAlt(0.002).pathColor(() => PAL.land).pathStroke(null).pathTransitionDuration(0)
    .pointLat('lat').pointLng('lon').pointAltitude(d => (d.group === 'market' ? 0.03 : 0.015)).pointResolution(16).pointsMerge(false)
    .pointRadius(d => (d.group === 'market' ? 0.45 + 0.75 * Math.abs(d.model || 0) / mx : 0.28)).pointColor(d => ncol(d)).pointLabel(d => `${d.label}: ${d.value || ''}`)
    .arcStartLat('sLat').arcStartLng('sLng').arcEndLat('eLat').arcEndLng('eLng').arcColor('color').arcStroke('stroke').arcDashLength('dash').arcDashGap('gap')
    .arcDashAnimateTime('time').arcAltitudeAutoScale(opts.arcScale || 0.3).arcLabel('tip').arcCurveResolution(48).arcsTransitionDuration(0)
    .htmlLat('lat').htmlLng('lon').htmlAltitude(0.035).htmlElement('el').htmlTransitionDuration(0);
  const m = G.globeMaterial(); m.color.set(PAL.globe); if (m.emissive) m.emissive.set(PAL.emissive); m.shininess = LIGHT ? 0 : 3;
  try { G.renderer().setPixelRatio(Math.min(1.75, window.devicePixelRatio || 1)); } catch (e) { /* default */ }
  G.controls().autoRotate = false;
  const STY = { measured: { stroke: 0.9, dash: 0.35, gap: 0.12, time: 2200 }, prior: { stroke: 0.35, dash: 0.05, gap: 0.04, time: 0 },
    noskill: { stroke: 0.35, dash: 0.04, gap: 0.05, time: 0 }, anecdotal: { stroke: 0.3, dash: 0.015, gap: 0.03, time: 0 } };
  const arcsFor = sel => D.graph.edges.filter(e => ids.has(e.source) && ids.has(e.target)).map(e => {
    const s = byId.get(e.source), t = byId.get(e.target), st = STY[e.cls] || STY.prior, on = !sel || (sel.has(e.source) && sel.has(e.target));
    const c = on ? LINK[e.cls] : PAL.dimArc;
    return { sLat: s.lat, sLng: s.lon, eLat: t.lat, eLng: t.lon, color: [c, c], stroke: st.stroke, dash: st.dash, gap: st.gap, time: st.time, tip: `${s.label} → ${t.label}: ${e.evidence}` };
  });
  const labels = (opts.compact ? [] : nodes).filter(n => n.group === 'market' || n.group === 'outcome' || (opts.channels && n.group === 'channel')).map(n => {
    const el = document.createElement('div');
    el.className = 'glab' + (n.group === 'channel' ? ' drv' : '') + (WALK.has(n.id) ? ' walk' : '');
    if (WALK.has(n.id)) el.addEventListener('click', () => select(n.id));
    el.innerHTML = n.group === 'market' ? `<span style="color:${ncol(n)}">●</span> ${esc(n.label)}${WALK.has(n.id) ? '<em class="wk">▶ walk into 3D office</em>' : ''}<small>${esc(n.value)}</small>` : `${esc(n.label)}<small>${esc(n.value || '')}</small>`;
    return { id: n.id, reg: regionOf(n), lat: n.lat, lon: n.lon, el };
  });
  if (NOREG) G.htmlElementVisibilityModifier((el, v) => { el.style.visibility = v ? '' : 'hidden'; }); // every label is up, so hide the ones behind the globe
  G.pathsData(LAND).pointsData(nodes).arcsData(arcsFor(null)).htmlElementsData(labels); // all layers set before the first frame
  new ResizeObserver(() => { G.width(host.clientWidth); G.height(host.clientHeight); }).observe(host);
  G.width(host.clientWidth); G.height(host.clientHeight);
  G.onPointClick(d => d && select(d.id));
  let sel = null;
  const api = {
    region: (r, ms = 1400) => { G.pointOfView(views[r], ms); labels.forEach(l => { l.el.style.display = NOREG || l.reg === r ? '' : 'none'; }); },
    highlight: id => { sel = linked(id); G.arcsData(arcsFor(sel)); labels.forEach(l => l.el.classList.toggle('dim', !!sel && !sel.has(l.id))); }
  };
  api.region(NOREG ? 'all' : opts.start || 'us', 0);
  listeners.push(id => api.highlight(id));
  return api;
}
// region buttons (#reg) drive the one globe; selecting a node or market flies there; optional idle tour
function regions(G, onChange, tour) {
  const bs = [...document.querySelectorAll('#reg button')];
  let cur = NOREG ? 'all' : 'us', touched = NOREG;
  const set = r => { cur = r; bs.forEach(b => b.classList.toggle('on', b.dataset.r === r)); G.region(r); onChange && onChange(NOREG ? 'all' : r); };
  bs.forEach(b => b.addEventListener('click', () => { touched = true; set(b.dataset.r); }));
  listeners.push(id => { touched = true; const n = id && D.graph.nodes.find(x => x.id === id); if (n && isNum(n.lat)) set(regionOf(n)); });
  if (tour) { const step = () => { if (touched) return; set(cur === 'us' ? 'gulf' : 'us'); setTimeout(step, 9000); }; setTimeout(step, 20000); }
  onChange && onChange(cur);
  return set;
}
const regionButtons = () => NOREG ? '' : '<div class="regions" id="reg"><button data-r="us" class="on">United States</button><button data-r="gulf">Gulf &amp; Kazakhstan</button></div>';

/* ---------------- causal graph (SVG, the layered Domino layout) ---------------- */
function graphSVG(svg) {
  const W = svg.clientWidth || 1000, H = svg.clientHeight || 640;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const cols = [[], [], []];
  D.graph.nodes.slice().sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id)).forEach(n => cols[n.level].push(n));
  const X = [W * 0.15, W * 0.5, W * 0.85], top = 22, bot = H - 104, pos = new Map(); // room for the legend
  const mx = Math.max(1, ...D.graph.nodes.filter(n => n.group === 'market').map(n => Math.abs(n.model || 0)));
  cols.forEach((c, l) => c.forEach((n, i) => {
    const f = l === 1 ? [0.18, 0.5, 0.82][i] : (c.length > 1 ? i / (c.length - 1) : 0.5);
    const r = n.group === 'market' ? 6 + 8 * Math.abs(n.model || 0) / mx : n.group === 'channel' ? 10 : n.group === 'outcome' ? 8 : 6;
    pos.set(n.id, { x: X[l], y: top + f * (bot - top), r });
  }));
  let html = D.graph.edges.map(e => { const a = pos.get(e.source), b = pos.get(e.target); if (!a || !b) return '';
    const seg = `x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"`;
    return `<g data-s="${esc(e.source)}" data-t="${esc(e.target)}"><line class="${esc(e.cls)}" ${seg}><title>${esc(e.evidence)}</title></line>${e.cls === 'measured' ? `<line class="pulse" ${seg}/>` : ''}</g>`; }).join('');
  html += D.graph.nodes.map(n => { const p = pos.get(n.id); if (!p) return '';
    return `<g class="nd" data-id="${esc(n.id)}" style="cursor:pointer"><title>${esc(n.label)}: ${esc(n.value || '')}</title>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}" fill="${ncol(n)}" stroke="${PAL.nodeStroke}" stroke-width="1.5"/>
      <text x="${p.x.toFixed(1)}" y="${(p.y + p.r + 13).toFixed(1)}">${esc(n.label)}</text><text class="v" x="${p.x.toFixed(1)}" y="${(p.y + p.r + 26).toFixed(1)}">${esc(n.value || '')}</text></g>`; }).join('');
  svg.innerHTML = html;
  svg.querySelectorAll('g.nd').forEach(g => g.addEventListener('click', () => select(g.dataset.id)));
  listeners.push(id => { const sel = linked(id);
    svg.querySelectorAll('g[data-s]').forEach(g => g.classList.toggle('dim', !!sel && !(sel.has(g.dataset.s) && sel.has(g.dataset.t))));
    svg.querySelectorAll('g.nd').forEach(g => g.classList.toggle('dim', !!sel && !sel.has(g.dataset.id))); });
}

/* ---------------- flow (V3): drivers -> channels -> markets as one SVG ---------------- */
function flow(svg) {
  const bb = svg.getBoundingClientRect(), W = bb.width || 1800, H = bb.height || 560;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const cols = [[], [], []];
  D.graph.nodes.slice().sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id)).forEach(n => cols[n.level].push(n));
  const BW = [300, 300, 330], X = [24, W / 2 - 150, W - 354], top = 34, bottom = 40, pos = new Map(), HH = H - bottom;
  cols.forEach((c, l) => { const bh = Math.min(38, (HH - top - 6 - (c.length - 1) * 5) / c.length), gap = l === 1 ? 70 : Math.max(5, (HH - top - 6 - c.length * bh) / Math.max(1, c.length - 1)); const tot = c.length * bh + (c.length - 1) * gap; let y = top + Math.max(0, (HH - top - tot) / 2);
    c.forEach(n => { pos.set(n.id, { x: X[l], y, w: BW[l], h: bh }); y += bh + gap; }); });
  const heads = ['DRIVERS · data we measured or sourced', 'CHANNELS · tested out of sample', 'MARKETS · Argon verdict'];
  let html = heads.map((h, l) => `<text class="h" x="${X[l]}" y="18">${h}</text>`).join('');
  html += D.graph.edges.map(e => { const s = pos.get(e.source), t = pos.get(e.target); if (!s || !t) return '';
    const x1 = s.x + s.w, y1 = s.y + s.h / 2, x2 = t.x, y2 = t.y + t.h / 2, mxp = (x1 + x2) / 2;
    const d = `M${x1},${y1} C${mxp},${y1} ${mxp},${y2} ${x2},${y2}`;
    return `<g data-s="${esc(e.source)}" data-t="${esc(e.target)}"><path class="l ${esc(e.cls)}" d="${d}"><title>${esc(e.evidence)}</title></path>${e.cls === 'measured' ? `<path class="pulse" d="${d}"/>` : ''}</g>`; }).join('');
  html += D.graph.nodes.map(n => { const p = pos.get(n.id); if (!p) return ''; const vc = n.group === 'market' ? ncol(n) : null;
    return `<g class="nd" data-id="${esc(n.id)}" style="cursor:pointer"><rect class="box ${esc(n.group)}" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="8" ${vc ? `style="stroke:${vc};stroke-width:1.6"` : ''}/>
      ${vc ? `<circle cx="${p.x + 14}" cy="${p.y + p.h / 2}" r="5" fill="${vc}"/>` : ''}
      <text x="${p.x + (vc ? 26 : 12)}" y="${p.y + p.h * 0.42}">${esc(n.label)}</text><text class="v" x="${p.x + (vc ? 26 : 12)}" y="${p.y + p.h * 0.82}">${esc(n.value || '')}</text>
      ${n.group === 'market' && n.verdict ? `<text x="${p.x + p.w - 10}" y="${p.y + 24}" text-anchor="end" style="fill:${vc};font:700 11px var(--sans);letter-spacing:.05em">${esc(String(n.verdict).toUpperCase())}</text>` : ''}</g>`; }).join('');
  svg.innerHTML = html;
  svg.querySelectorAll('g.nd').forEach(g => g.addEventListener('click', () => select(g.dataset.id)));
  listeners.push(id => { const sel = linked(id);
    svg.querySelectorAll('g[data-s]').forEach(g => g.classList.toggle('dim', !!sel && !(sel.has(g.dataset.s) && sel.has(g.dataset.t))));
    svg.querySelectorAll('g.nd').forEach(g => g.classList.toggle('dim', !!sel && !sel.has(g.dataset.id))); });
}

/* ---------------- the three mocks ---------------- */
const drvHTML = r => D.graph.nodes.filter(n => n.group === 'driver' && isNum(n.lat) && (r === 'all' || regionOf(n) === r)).map(n => `<span style="color:${PAL.driverText}">●</span> ${esc(n.label)} <b style="color:var(--ink-2)">${esc(n.value || '')}</b>`).join('<br>');
const mktHTML = r => D.graph.nodes.filter(n => n.group === 'market' && (r === 'all' || regionOf(n) === r)).map(n => `<span style="color:${ncol(n)}">●</span> ${esc(n.label)} <span style="color:${ncol(n)}">${esc(n.verdict || '')}</span>`).join('<br>');
const REGNAME = { us: 'United States', gulf: 'Gulf & Kazakhstan', all: 'World' };
function v1() {
  const m = $('#main');
  m.style.gridTemplateColumns = 'minmax(0,1.62fr) minmax(0,1fr)'; m.style.gridTemplateRows = 'minmax(0,1fr) 196px';
  m.innerHTML = `<section class="panel" style="padding:0"><div class="gtitle"><div class="eyebrow" id="regTitle"></div><div class="s" id="drv"></div></div>${regionButtons()}
      <div class="viz full" id="g1"></div><div class="legend">${legendHTML()}</div></section>
    <section style="display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;min-height:0">
      <div id="k"></div>
      <div class="panel"><div class="ph"><div class="eyebrow">Where to invest · 12 m, USD</div><div class="hint">click a row to trace its links</div></div><div id="rk"></div></div>
      <div class="panel pick" id="pick"></div></section>
    <section class="panel" style="grid-column:1/3"><div class="ph"><div class="eyebrow">Measured chains</div><div class="hint">level cards · only links with out-of-sample evidence</div></div><div id="ch" style="height:calc(100% - 22px)"></div></section>`;
  kpis($('#k'), 2); ranking($('#rk'), { yield: true, note: true }); chains($('#ch'));
  $('#pick').innerHTML = `<b>Argon's pick</b> · ${esc((D.pick || '').slice(0, 260))}`;
  const G = globe($('#g1'), { channels: true, views: { us: { lat: 33, lng: -93, altitude: 1.15 }, gulf: { lat: 35, lng: 62, altitude: 1.25 } } });
  // in the single world view the drivers list would cover the globe; they're still in the chains below
  regions(G, r => { $('#regTitle').textContent = REGNAME[r]; $('#drv').innerHTML = NOREG ? '' : 'drivers<br>' + drvHTML(r); }, true);
}
function v2() {
  const m = $('#main');
  m.style.gridTemplateColumns = 'minmax(0,1.15fr) minmax(0,1fr)'; m.style.gridTemplateRows = 'auto minmax(0,1fr) 128px';
  m.innerHTML = `<section id="k" style="grid-column:1/3"></section>
    <section class="panel"><div class="ph"><div class="eyebrow">Causal graph</div><div class="hint">drivers → channels → markets · click a node</div></div><div class="viz"><svg id="cg" role="img" aria-label="Causal graph"></svg></div><div class="legend">${legendHTML()}</div></section>
    <section class="panel"><div class="ph"><div class="eyebrow">Map</div><div class="hint">follows your selection</div></div>${regionButtons()}<div class="viz" id="g1"></div></section>
    <section style="grid-column:1/3;min-height:0"><div class="mcards" id="mc"></div></section>`;
  kpis($('#k'), 4);
  graphSVG($('#cg'));
  const G = globe($('#g1'), { channels: true });
  regions(G);
  $('#mc').innerHTML = (D.markets || []).map(r => { const a = r.argon || {};
    return `<div class="mc" data-id="${esc(r.key)}" title="${esc(a.why || '')}"><div class="nm">${esc(r.market)}</div><div><span class="pill ${esc(a.verdict || '')}">${esc(a.verdict || '—')}</span></div>
      <div class="big" style="color:${VERDICT[a.verdict] || 'var(--ink)'}">${pct(a.exp)}</div><div class="sub">Argon 12 m · model ${pct(r.model_12m)}</div><div class="sub">gross yield ${pct(r.gross, 1, false)}</div></div>`; }).join('');
  $('#mc').querySelectorAll('.mc').forEach(c => c.addEventListener('click', () => select(c.dataset.id)));
  listeners.push(id => $('#mc').querySelectorAll('.mc').forEach(c => c.classList.toggle('sel', c.dataset.id === id)));
}
function v3() {
  const m = $('#main');
  m.style.gridTemplateColumns = 'minmax(0,1fr) minmax(0,1.35fr)'; m.style.gridTemplateRows = 'auto minmax(0,1fr) 318px'; document.body.classList.add('tight');
  m.innerHTML = `<section id="k" style="grid-column:1/3"></section>
    <section class="panel" style="grid-column:1/3"><svg id="flow" role="img" aria-label="Causal flow from drivers to markets"></svg><div class="legend">${legendHTML()}</div></section>
    <section class="panel"><div class="ph"><div class="eyebrow">Where to invest · 12 m, USD</div></div><div id="rk"></div></section>
    <section class="panel" style="padding:0"><div class="gtitle"><div class="eyebrow" id="regTitle"></div><div class="s" id="mk"></div></div>${regionButtons()}<div class="viz full" id="g1"></div></section>`;
  kpis($('#k'), 4); flow($('#flow')); ranking($('#rk'), {});
  const G = globe($('#g1'), { compact: true, arcScale: 0.22, views: { us: { lat: 32, lng: -92, altitude: 1.05 }, gulf: { lat: 35, lng: 62, altitude: 1.2 } } });
  regions(G, r => { $('#regTitle').textContent = REGNAME[r]; $('#mk').innerHTML = mktHTML(r); });
}

(async () => {
  $('#tabs').innerHTML = MOCKS.map(x => `<a class="tab${x.v === V ? ' on' : ''}" href="?v=${x.v}${TQ}"><b>V${x.v}</b>${esc(x.name)}</a>`).join('');
  $('#vdesc').textContent = MOCKS[V - 1].desc;
  $('#themeT').innerHTML = [['', 'dark'], ['white', 'white'], ['offwhite', 'off-white']].map(([t, l]) => `<a href="?v=${V}${t ? '&theme=' + t : ''}" class="${t === THEME ? 'on' : ''}">${l}</a>`).join(' · ');
  document.addEventListener('keydown', e => { if (/^[1-3]$/.test(e.key)) location.search = '?v=' + e.key + TQ; if (e.key === 'Escape') select(null); });
  try {
    const [d, land] = await Promise.all([getJSON('/profiles/real-estate/dashboard.json'), getJSON('/vendor/ne_110m_countries.json').catch(() => ({ features: [] }))]);
    D = d;
    for (const f of land.features || []) { if (!f.properties || f.properties.a3 === 'ATA') continue; const g = f.geometry || {};
      for (const poly of g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : []) for (const ring of poly) LAND.push({ pts: ring }); }
    $('#asof').innerHTML = `as of <b>${esc(D.asof || '')}</b>`;
    $('#hash').innerHTML = D.hash ? `hash <b>${esc(String(D.hash).slice(0, 8))}…</b>` : '';
    ({ 1: v1, 2: v2, 3: v3 })[V]();
    document.body.dataset.ready = '1';
  } catch (e) { $('#main').innerHTML = `<p style="color:#EF6461">Could not load the dashboard data: ${esc(e.message)}</p>`; }
})();
})();
