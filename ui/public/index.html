<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextDay — Forecasting &amp; Model Benchmark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- MINIMAL HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-badge">24H</span>
        <span class="brand-name">NextDay</span>
      </div>

      <nav class="steps-nav" aria-label="Navigation">
        <button class="step-tab active" data-view="sources">Sources</button>
        <button class="step-tab" data-view="predict">Predictions</button>
        <button class="step-tab" data-view="benchmark">Benchmark</button>
      </nav>

      <div class="header-spacer"></div>
    </div>
  </header>

  <main class="container">

    <!-- ===================================================================
         VIEW 1: SOURCES
         =================================================================== -->
    <section class="view active" id="view-sources">
      <div class="view-header">
        <h1>Select Data Sources</h1>
        <div class="region-pills" id="region-pills"></div>
      </div>

      <div class="sources-grid" id="sources-grid"></div>

      <div class="source-config-sheet hidden" id="source-config-sheet"></div>

      <div class="action-bar">
        <div class="action-bar-left">
          <div class="active-logos-stack" id="active-logos-stack"></div>
          <div class="action-metrics">
            <span class="metric-main" id="sim-jobs-label">0 API Calls</span>
            <span class="metric-sub" id="sim-cost-label">Est. $0.00 · Max $0.00</span>
          </div>
        </div>
        <div class="action-bar-right">
          <div class="budget-control">
            <span>Cap $</span>
            <input type="number" id="budget-input" value="1.00" step="0.10" min="0.10" max="10.00" />
          </div>
          <button class="btn-secondary" id="btn-download-plan" type="button">Download Plan</button>
          <button class="btn-primary" id="btn-run-prediction" type="button">Run Prediction →</button>
        </div>
      </div>
    </section>

    <!-- ===================================================================
         VIEW 2: PREDICTIONS (PREVIOUS RUNS + HISTORICAL DATES + MODEL PICKER)
         =================================================================== -->
    <section class="view" id="view-predict">
      <div class="view-header">
        <h1>Predictions</h1>
        <div class="model-selector-group" id="pred-model-selector"></div>
      </div>

      <!-- PREVIOUS RUNS & HISTORICAL DATES STRIP -->
      <div class="runs-strip-wrap">
        <div class="runs-strip" id="pred-runs-strip"></div>
      </div>

      <!-- SOURCE FILTER BAR + RUN SUMMARY -->
      <div class="sub-toolbar">
        <div class="source-filter-bar" id="pred-source-filters"></div>
        <div class="day-summary-pill" id="pred-day-summary"></div>
      </div>

      <div id="predictions-container"></div>
    </section>

    <!-- ===================================================================
         VIEW 3: BENCHMARK (SIMPLE GRAPH ON TOP + METRICS + HEAD-TO-HEAD)
         =================================================================== -->
    <section class="view" id="view-benchmark">
      <div class="view-header">
        <h1>Model Benchmark</h1>
        <div class="metric-tabs" id="chart-metric-tabs">
          <button class="filter-chip active" data-metric="accuracy">Accuracy (%)</button>
          <button class="filter-chip" data-metric="brier">Calibration (Brier ↓)</button>
          <button class="filter-chip" data-metric="judge">Judge Score (1–5)</button>
        </div>
      </div>

      <!-- TOP GRAPH CARD -->
      <div class="chart-card">
        <div class="chart-top">
          <div class="chart-title-wrap">
            <h2 id="chart-title">10-Day Forecast Accuracy (%)</h2>
            <p id="chart-subtitle">Percentage of directional and binary events predicted correctly across Oct 15–24, 2026</p>
          </div>
          <div class="chart-legend" id="chart-legend"></div>
        </div>
        <div class="chart-svg-wrap" id="benchmark-chart"></div>
      </div>

      <!-- 4 MODEL LEADERBOARD CARDS -->
      <div class="leaderboard-grid" id="leaderboard-grid"></div>

      <!-- HEAD-TO-HEAD DAY & TRACK TABLE -->
      <div class="feed-section">
        <div class="feed-header">
          <div class="feed-tabs" id="bench-track-tabs"></div>
          <select id="bench-day-select" class="select-minimal"></select>
        </div>
        <div id="bench-comparison-list"></div>
      </div>
    </section>

  </main>

  <!-- SLIDE-OVER DETAIL SHEET -->
  <div class="sheet-backdrop hidden" id="detail-sheet">
    <div class="sheet-panel">
      <div class="sheet-header">
        <div id="sheet-badge"></div>
        <button class="sheet-close" id="btn-sheet-close" type="button">✕</button>
      </div>
      <div class="sheet-content" id="sheet-content"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/app.js" defer></script>
</body>
</html>
