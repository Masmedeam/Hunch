<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hunch — Next-Day Forecasting &amp; Model Benchmark</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23171716'/%3E%3Cpath d='M11 29c0-7.5 3.8-14 9-14s9 6.5 9 14' fill='%23FAF9F6'/%3E%3Cpath d='M13 17l-2.5-5.5L16 14M27 17l2.5-5.5L24 14' fill='%23FAF9F6' stroke='%23FAF9F6' stroke-width='1.5' stroke-linejoin='round'/%3E%3Ccircle cx='16.5' cy='20.5' r='3.2' fill='%23171716'/%3E%3Ccircle cx='23.5' cy='20.5' r='3.2' fill='%23171716'/%3E%3Ccircle cx='17.3' cy='19.7' r='1.1' fill='%23FAF9F6'/%3E%3Ccircle cx='24.3' cy='19.7' r='1.1' fill='%23FAF9F6'/%3E%3Ccircle cx='23.5' cy='20.5' r='4.6' fill='none' stroke='%23E1381C' stroke-width='1.6'/%3E%3Cpath d='M18.5 24.2c1 1.1 2 1.1 3 0' fill='none' stroke='%23E1381C' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='29' cy='10' r='2.2' fill='%23E1381C'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- MINIMAL HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="hunch-mascot" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="11" fill="#171716"/>
            <!-- Friendly little Hunch owl/detective silhouette -->
            <path d="M10.5 31C10.5 22.2 14.4 15.5 20 15.5C25.6 15.5 29.5 22.2 29.5 31H10.5Z" fill="#FAF9F6"/>
            <!-- Little tufted ears -->
            <path d="M13.5 17.5L11 11.5L16.8 15.2Z" fill="#FAF9F6" stroke="#FAF9F6" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M26.5 17.5L29 11.5L23.2 15.2Z" fill="#FAF9F6" stroke="#FAF9F6" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- Expressive eyes -->
            <circle cx="16.5" cy="21.5" r="3.1" fill="#171716"/>
            <circle cx="23.5" cy="21.5" r="3.1" fill="#171716"/>
            <circle cx="17.4" cy="20.6" r="1.15" fill="#FFFFFF"/>
            <circle cx="24.4" cy="20.6" r="1.15" fill="#FFFFFF"/>
            <!-- Signature Hunch monocle & lightbulb spark -->
            <circle cx="23.5" cy="21.5" r="4.7" stroke="#E1381C" stroke-width="1.6"/>
            <path d="M28.2 22.5L30.2 25" stroke="#E1381C" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Friendly little beak/smile -->
            <path d="M18.6 25.2Q20 26.8 21.4 25.2" stroke="#E1381C" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            <!-- Idea spark dot -->
            <circle cx="30.5" cy="9.5" r="2.2" fill="#E1381C"/>
          </svg>
        </div>
        <span class="brand-name">Hunch</span>
      </div>

      <nav class="steps-nav" aria-label="Navigation">
        <button class="step-tab active" data-view="sources">Sources</button>
        <button class="step-tab" data-view="predict">Predictions</button>
        <button class="step-tab" data-view="benchmark">Benchmark</button>
      </nav>

      <div class="header-spacer"></div>
    </div>
  </header>

  <main class="container">

    <!-- ===================================================================
         VIEW 1: SOURCES
         =================================================================== -->
    <section class="view active" id="view-sources">
      <div class="view-header">
        <h1>Select Data Sources</h1>
        <div class="region-pills" id="region-pills"></div>
      </div>

      <div class="sources-grid" id="sources-grid"></div>

      <div class="source-config-sheet hidden" id="source-config-sheet"></div>

      <div class="action-bar">
        <div class="action-bar-left">
          <div class="active-logos-stack" id="active-logos-stack"></div>
          <div class="action-metrics">
            <span class="metric-main" id="sim-jobs-label">0 API Calls</span>
            <span class="metric-sub" id="sim-cost-label">Est. $0.00 · Max $0.00</span>
          </div>
        </div>
        <div class="action-bar-prompt">
          <input
            type="text"
            id="user-prompt-input"
            class="prompt-input"
            placeholder="Guide the prediction (e.g., Focus on CA gas prices, AI jobs in SF, or NVDA pre-market)…"
          />
        </div>
        <div class="action-bar-right">
          <button class="btn-primary" id="btn-run-prediction" type="button">Run Prediction →</button>
        </div>
      </div>
    </section>

    <!-- ===================================================================
         VIEW 2: PREDICTIONS (PREVIOUS RUNS + HISTORICAL DATES)
         =================================================================== -->
    <section class="view" id="view-predict">
      <div class="view-header">
        <h1>Predictions</h1>
      </div>

      <!-- PREVIOUS RUNS & HISTORICAL DATES STRIP -->
      <div class="runs-strip-wrap">
        <div class="runs-strip" id="pred-runs-strip"></div>
      </div>

      <!-- SOURCE FILTER BAR + RUN SUMMARY -->
      <div class="sub-toolbar">
        <div class="source-filter-bar" id="pred-source-filters"></div>
        <div class="day-summary-pill" id="pred-day-summary"></div>
      </div>

      <div id="predictions-container"></div>
    </section>

    <!-- ===================================================================
         VIEW 3: BENCHMARK (SIMPLE GRAPH ON TOP + METRICS + HEAD-TO-HEAD)
         =================================================================== -->
    <section class="view" id="view-benchmark">
      <div class="view-header">
        <h1>Model Benchmark</h1>
        <div class="metric-tabs" id="chart-metric-tabs">
          <button class="filter-chip active" data-metric="accuracy">Accuracy (%)</button>
          <button class="filter-chip" data-metric="brier">Calibration (Brier ↓)</button>
          <button class="filter-chip" data-metric="judge">Judge Score (1–5)</button>
        </div>
      </div>

      <!-- TOP GRAPH CARD -->
      <div class="chart-card">
        <div class="chart-top">
          <div class="chart-title-wrap">
            <h2 id="chart-title">10-Day Forecast Accuracy (%)</h2>
            <p id="chart-subtitle">Percentage of directional and binary events predicted correctly across Oct 15–24, 2026</p>
          </div>
          <div class="chart-legend" id="chart-legend"></div>
        </div>
        <div class="chart-svg-wrap" id="benchmark-chart"></div>
      </div>

      <!-- 4 MODEL LEADERBOARD CARDS -->
      <div class="leaderboard-grid" id="leaderboard-grid"></div>

      <!-- HEAD-TO-HEAD DAY & TRACK TABLE -->
      <div class="feed-section">
        <div class="feed-header">
          <div class="feed-tabs" id="bench-track-tabs"></div>
          <select id="bench-day-select" class="select-minimal"></select>
        </div>
        <div id="bench-comparison-list"></div>
      </div>
    </section>

  </main>

  <!-- SLIDE-OVER DETAIL SHEET -->
  <div class="sheet-backdrop hidden" id="detail-sheet">
    <div class="sheet-panel">
      <div class="sheet-header">
        <div id="sheet-badge"></div>
        <button class="sheet-close" id="btn-sheet-close" type="button">✕</button>
      </div>
      <div class="sheet-content" id="sheet-content"></div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/app.js" defer></script>
</body>
</html>
