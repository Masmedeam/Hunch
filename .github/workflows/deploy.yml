name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-deploy:
    name: Test & Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies & run unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG_TOML: ${{ secrets.WRANGLER_CONFIG_TOML }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$WRANGLER_CONFIG_TOML" ]; then
            mkdir -p ~/.config/.wrangler/config ~/.wrangler/config
            printf '%s\n' "$WRANGLER_CONFIG_TOML" > ~/.config/.wrangler/config/default.toml
            printf '%s\n' "$WRANGLER_CONFIG_TOML" > ~/.wrangler/config/default.toml
            unset CLOUDFLARE_API_TOKEN
          fi
          npx wrangler@latest deploy
